services:
  temporal-server:
    image: temporalio/temporal:latest
    container_name: learnfinance-temporal-server
    restart: always
    ports:
      - "7233:7233"
      - "8233:8233"
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/data/temporal.db
      - --ui-port=8233
    volumes:
      # Bind mount to a host-owned directory so Temporal's non-root user
      # can write temporal.db. Override TEMPORAL_DATA_DIR via env for
      # other hosts. Default assumes Pi user 'razin'. Create once:
      #   mkdir -p ~/learnfinance/temporal-data && chmod 777 ~/learnfinance/temporal-data
      - ${TEMPORAL_DATA_DIR:-/home/razin/learnfinance/temporal-data}:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  brain-api:
    build: ./brain_api
    container_name: learnfinance-brain-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./brain_api/.env
    volumes:
      # Bind mount so Pi-generated state survives `docker compose up -d --build`.
      # Critical: allocation/sticky_history.db (weekly HRP carry-set),
      # ibkr/submitted_orders.db (IBKR dedup), experience/, raw/features/output audits.
      # Nice-to-have: models/ (HF lazy-download when STORAGE_BACKEND=hf_first),
      # cache/universe/, sentiment + fundamentals caches.
      # Override BRAIN_DATA_DIR for other hosts. Default assumes Pi user 'razin'. Create once:
      #   mkdir -p ~/learnfinance/brain-data && chmod 777 ~/learnfinance/brain-data
      - ${BRAIN_DATA_DIR:-/home/razin/learnfinance/brain-data}:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/docs').read(); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Interactive Brokers Gateway (paper) for the sac_halal SAC workflow.
  # gnzsnz/ib-gateway is multi-arch (amd64 + arm64 since 10.37.1l); IBC is
  # bundled so headless auto-login works once 2FA has been confirmed once
  # via VNC. Memory-leak protection uses the JVM's built-in soft restart
  # (preserves the security token, no nightly 2FA push).
  #
  # Weekly reauth: IBKR invalidates the session during the Saturday
  # maintenance window (~13:00 SGT). Exactly one IBKR Mobile push fires
  # per week; tap to confirm. If missed, the gateway auto-restarts and
  # retries every TWOFA_EXIT_INTERVAL seconds until accepted.
  #
  # network_mode: host so brain-api on the same Pi can reach localhost:4002
  # without docker-network NAT issues. ports: kept for visibility; on
  # host networking they are informational only.
  ibkr-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: learnfinance-ibkr-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      TRADING_MODE: paper
      # Soft restart cycles the JVM in-place; keeps the 2FA-blessed
      # session token alive so no daily push fires.
      AUTO_RESTART_TIME: "11:59 PM"
      # On weekend reauth: don't exit, just restart and re-prompt 2FA.
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      # 1 hour between reauth retries -- avoids spamming the phone with a
      # fresh push every minute. Headroom: weekend reauth Sat ~13:00 SGT
      # vs Monday 20:30 SGT trade slot = ~31 hours = ~30 retry attempts.
      TWOFA_EXIT_INTERVAL: "3600"
      TIME_ZONE: Asia/Singapore
      # Credentials must be provided via .env (see brain_api/.env.example).
      # IB_USERNAME / IB_PASSWORD are the gnzsnz image's documented vars.
    env_file:
      - ./brain_api/.env
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep -q ':4002 .*LISTEN' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  temporal-worker:
    build: ./temporal
    container_name: learnfinance-temporal-worker
    restart: always
    depends_on:
      temporal-server:
        condition: service_healthy
      brain-api:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - BRAIN_API_URL=http://brain-api:8000
      - TEMPORAL_TASK_QUEUE=learnfinance-inference

  temporal-schedules-init:
    build: ./temporal
    container_name: learnfinance-temporal-schedules-init
    restart: on-failure
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
    command: ["uv", "run", "python", "-m", "schedules"]
    # One-shot: exits 0 after registering (or skipping) schedules.
    # `Exited (0)` in `docker compose ps` is the EXPECTED healthy state for this service.

fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        # No --fix: auto-fix modifies working dir but doesn't stage,
        # so commit passes but fixes aren't committed. Check-only is safer.
      - id: ruff-format
        args: [--check]  # Check only, fail if formatting needed

  - repo: local
    hooks:
      - id: quantbmad-research-gate
        name: QuantBMAD research gate
        entry: python3 _bmad/quantbmad/scripts/check_research_gate.py
        language: system
        pass_filenames: true
      - id: quantbmad-unit-tests
        name: QuantBMAD unit tests
        entry: bash -c 'if [ -x .venv/bin/python ]; then .venv/bin/python -m pytest _bmad/quantbmad/tests -q; else python3 -m pytest _bmad/quantbmad/tests -q; fi'
        language: system
        pass_filenames: false
        files: ^_bmad/quantbmad/
      - id: pytest
        name: pytest
        entry: bash -c 'devbox run brain:setup && devbox run brain:test'
        language: system
        pass_filenames: false
        types: [python]
